version: '3.8'

services:
  # ===================
  # FastAPI Backend
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./prompting:/prompting:ro
      - repos_data:/app/repos
      - settings_data:/app/data
      - claude_auth_data:/home/appuser/.claude
      - /var/run/docker.sock:/var/run/docker.sock  # For sandbox
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
      - REPOS_DIR=/app/repos
      - DATA_DIR=/app/data
      # Docker port-forwarding makes the client IP non-loopback; allow bootstrap token fetch
      # while keeping the service host-bound to localhost.
      - AUTH_BOOTSTRAP_ALLOW_REMOTE=true
      # API keys from .env (can be overridden in settings UI)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://quickhack:quickhack_dev@postgres:5432/quickhack
    depends_on:
      - redis
      - postgres
    networks:
      - quick_hack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # Next.js Frontend
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - quick_hack
    restart: unless-stopped

  # ===================
  # Ollama (Local LLM)
  # ===================
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - quick_hack
    restart: unless-stopped
    # GPU Support (uncomment for NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ===================
  # Redis (Cache + PubSub) - Optional
  # ===================
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"  # Use 6380 to avoid conflicts with local Redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - quick_hack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # PostgreSQL (User Database)
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: quick_hack_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: quickhack
      POSTGRES_PASSWORD: quickhack_dev
      POSTGRES_DB: quickhack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickhack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quick_hack

volumes:
  repos_data:
    driver: local
  settings_data:
    driver: local
  claude_auth_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  quick_hack:
    driver: bridge
